name: release-validation

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    env:
      AGENT_SYMPHONY_REQUIRE_CODEX_SANDBOX: '1'
      CODEX_VERSION: '0.153.0'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/agent-symphony/dashboard/package-lock.json
      - name: Install pinned Codex sandbox
        run: |
          set -euo pipefail
          prefix=/usr/local/agent-symphony-codex
          cache="$RUNNER_TEMP/agent-symphony-codex-npm-cache"
          sudo rm -rf "$prefix"
          sudo rm -rf "$cache"
          sudo -H env "PATH=$PATH" npm install --global --prefix "$prefix" --cache "$cache" "@openai/codex@$CODEX_VERSION"
          case "$(uname -s)/$(uname -m)" in
            Darwin/x86_64) package=codex-darwin-x64; target=x86_64-apple-darwin ;;
            Darwin/arm64) package=codex-darwin-arm64; target=aarch64-apple-darwin ;;
            Linux/x86_64) package=codex-linux-x64; target=x86_64-unknown-linux-musl ;;
            Linux/aarch64) package=codex-linux-arm64; target=aarch64-unknown-linux-musl ;;
            *) echo "unsupported Codex platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
          esac
          native_root="$prefix/lib/node_modules/@openai/codex/node_modules/@openai/$package"
          native="$native_root/vendor/$target/bin/codex"
          sudo chown -R 0:0 "$prefix"
          sudo chmod -R go-w "$prefix"
          test -f "$native" && test ! -L "$native" && test -x "$native"
          test -z "$(find "$native_root" ! -type d ! -type f -print -quit)"
          test -z "$(find "$native_root" \( -type d -o -type f \) \( ! -user root -o -perm -020 -o -perm -002 \) -print -quit)"
          test "$("$native" --version)" = "codex-cli $CODEX_VERSION"
          printf 'CODEX_NATIVE=%s\n' "$native" >> "$GITHUB_ENV"
          dirname "$native" >> "$GITHUB_PATH"
      - run: scripts/build-dashboard.sh
      - run: cmd/agent-symphony/dashboard/node_modules/.bin/playwright install --with-deps chromium
      - name: Install full-system test prerequisite (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux
      - name: Enable the Ubuntu runner's unprivileged namespace prerequisite
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if test -n "$current_userns" && test "$current_userns" != 1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if test -n "$current_apparmor" && test "$current_apparmor" != 0; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install full-system test prerequisite (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install tmux
      - name: Prove rootless worker confinement as the runner user
        run: |
          test "$(id -u)" -ne 0
          config=.agent-symphony-ci.yaml
          trap 'rm -f "$config"' EXIT
          test "$("$CODEX_NATIVE" --version)" = "codex-cli $CODEX_VERSION"
          go run ./cmd/agent-symphony init --config "$config"
          sed "s#\"codex\"#\"$CODEX_NATIVE\"#g" "$config" > "$config.native"
          mv "$config.native" "$config"
          go run ./cmd/agent-symphony doctor --offline --config "$config" --runtime-state "$HOME/.agent-symphony-doctor-ci"
      - name: Run deterministic full-system gate
        run: |
          tmux -V
          AGENT_SYMPHONY_FULL_SYSTEM_E2E=1 go test ./cmd/agent-symphony -run '^Test(FullSystemE2E|HistoricalAttemptActionsFullSystemE2E|DashboardLifecycleFullSystemE2E|DashboardOrchestratorFullSystemE2E|QuotaDegradedStartupFullSystem)$' -count=1 -timeout 10m
          AGENT_SYMPHONY_FULL_SYSTEM_E2E=1 AGENT_SYMPHONY_FULL_SYSTEM_RACE=1 go test -race ./cmd/agent-symphony -run '^Test(FullSystemE2E|HistoricalAttemptActionsFullSystemE2E|DashboardLifecycleFullSystemE2E|DashboardOrchestratorFullSystemE2E|QuotaDegradedStartupFullSystem)$' -count=1 -timeout 10m
      - run: npm --prefix cmd/agent-symphony/dashboard run test:browser
      - run: rm -rf cmd/agent-symphony/dashboard/node_modules
      - run: scripts/validate-release.sh 0.0.0-ci

  wsl2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate on WSL2 native filesystem
        shell: pwsh
        run: |
          $distribution = 'Ubuntu'
          wsl --set-default-version 2
          if ($LASTEXITCODE -ne 0) { throw 'WSL2 is unavailable on this runner' }
          wsl --install --distribution $distribution --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { throw "Failed to install WSL distribution: $distribution" }
          wsl -d $distribution -- true
          if ($LASTEXITCODE -ne 0) { throw "Failed to initialize WSL distribution: $distribution" }
          $rows = ((wsl --list --verbose) -join "`n") -replace "`0", ''
          if ($rows -notmatch "(?m)^\s*\*?\s*$distribution\s+\S+\s+2\s*$") { throw "WSL distribution is not version 2:`n$rows" }
          wsl -d $distribution -- bash -lc 'set -euo pipefail; sudo env DEBIAN_FRONTEND=noninteractive apt-get update; sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bubblewrap build-essential ca-certificates curl git ruby tmux xz-utils'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install WSL validation prerequisites' }
          wsl -d $distribution -- bash -lc 'set -euo pipefail; current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"; if test -n "$current_userns" && test "$current_userns" != 1; then sudo sysctl -w kernel.unprivileged_userns_clone=1; fi; current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"; if test -n "$current_apparmor" && test "$current_apparmor" != 0; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to enable WSL unprivileged user namespaces' }
          $validationUser = 'agent-symphony-ci'
          wsl -d $distribution --user root -- useradd --create-home --user-group --shell /bin/bash $validationUser
          if ($LASTEXITCODE -ne 0) { throw 'Failed to provision the WSL validation user' }
          wsl -d $distribution --user $validationUser -- mkdir "/home/$validationUser/agent-symphony-ci"
          git archive --format=tar HEAD | wsl -d $distribution --user $validationUser -- tar -xf - -C "/home/$validationUser/agent-symphony-ci"
          wsl -d $distribution --user $validationUser --cd "/home/$validationUser/agent-symphony-ci" -- bash -lc "chmod 0755 scripts/credential-scan.sh scripts/credential-scan-test.sh scripts/lint.sh scripts/live-pilot.sh scripts/live-pilot-test.sh scripts/release.sh scripts/smoke-release.sh scripts/validate-release.sh scripts/wsl-release-validation.sh; git init -q; git remote add origin '$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git'; git add .; git -c user.name=ci -c user.email=ci@invalid commit -qm snapshot"
          $goArchiveVersion = '1.26.0'
          $goDirective = (Select-String '^go ([0-9.]+)$' go.mod).Matches.Groups[1].Value
          $goDirectiveMatch = [regex]::Match($goDirective, '^(\d+)\.(\d+)(?:\.\d+)?$')
          $goArchiveMatch = [regex]::Match($goArchiveVersion, '^(\d+)\.(\d+)\.\d+$')
          if (!$goDirectiveMatch.Success -or !$goArchiveMatch.Success -or $goDirectiveMatch.Groups[1].Value -ne $goArchiveMatch.Groups[1].Value -or $goDirectiveMatch.Groups[2].Value -ne $goArchiveMatch.Groups[2].Value) {
            throw "go.mod directive '$goDirective' does not match pinned Go archive $goArchiveVersion"
          }
          $machine = (wsl -d $distribution -- uname -m).Trim()
          switch ($machine) {
            'x86_64' { $goArch = 'amd64'; $goSHA256 = 'aac1b08a0fb0c4e0a7c1555beb7b59180b05dfc5a3d62e40e9de90cd42f88235'; $nodeArch = 'x64'; $nodeSHA256 = '7dca2ab34ec817aa4781e2e99dfd34d349eff9be86e5d5fbaa7e96cae8ee3179'; $codexPlatform = 'linux-x64'; $codexTarget = 'x86_64-unknown-linux-musl' }
            'aarch64' { $goArch = 'arm64'; $goSHA256 = 'bd03b743eb6eb4193ea3c3fd3956546bf0e3ca5b7076c8226334afe6b75704cd'; $nodeArch = 'arm64'; $nodeSHA256 = 'f4ae8ddf7487dfaf7da92fef463ee55cc29d8772d62891361dc3fc8b8e469205'; $codexPlatform = 'linux-arm64'; $codexTarget = 'aarch64-unknown-linux-musl' }
            default { throw "Unsupported WSL architecture: $machine" }
          }
          wsl -d $distribution -- bash -lc "set -e; curl -fsSLo /tmp/go.tgz https://go.dev/dl/go${goArchiveVersion}.linux-${goArch}.tar.gz; printf '%s  %s\n' '${goSHA256}' /tmp/go.tgz | sha256sum -c -; sudo rm -rf /usr/local/go; sudo tar -C /usr/local -xzf /tmp/go.tgz"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install pinned Go toolchain in WSL' }
          $nodeVersion = '22.15.1'
          wsl -d $distribution -- bash -lc "set -e; curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v${nodeVersion}/node-v${nodeVersion}-linux-${nodeArch}.tar.xz; printf '%s  %s\n' '${nodeSHA256}' /tmp/node.tar.xz | sha256sum -c -; sudo rm -rf /usr/local/node; sudo mkdir /usr/local/node; sudo tar -C /usr/local/node --strip-components=1 -xJf /tmp/node.tar.xz"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install pinned Node.js toolchain in WSL' }
          $codexVersion = '0.153.0'
          wsl -d $distribution -- bash -lc "set -e; sudo rm -rf /usr/local/codex; sudo env PATH=/usr/local/node/bin:/usr/bin:/bin /usr/local/node/bin/npm install --global --prefix /usr/local/codex '@openai/codex@${codexVersion}'"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install pinned Codex CLI in WSL' }
          $codexRoot = "/usr/local/codex/lib/node_modules/@openai/codex/node_modules/@openai/codex-${codexPlatform}"
          $codexNative = "/usr/local/codex/lib/node_modules/@openai/codex/node_modules/@openai/codex-${codexPlatform}/vendor/${codexTarget}/bin/codex"
          wsl -d $distribution -- bash -lc "set -e; sudo chown -R 0:0 /usr/local/codex; sudo chmod -R go-w /usr/local/codex; test -f '${codexNative}' && test ! -L '${codexNative}' && test -x '${codexNative}'; ! find '${codexRoot}' ! -type d ! -type f -print -quit | grep -q .; ! find '${codexRoot}' \( -type d -o -type f \) \( ! -user root -o -perm -020 -o -perm -002 \) -print -quit | grep -q .; '${codexNative}' --version | grep -qx 'codex-cli ${codexVersion}'"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned WSL Codex installation is unsafe or invalid' }
          wsl -d $distribution --user $validationUser --cd "/home/$validationUser" -- bash agent-symphony-ci/scripts/wsl-release-validation.sh proof "$codexNative"
          if ($LASTEXITCODE -ne 0) { throw 'WSL rootless Codex confinement proof failed' }
          wsl -d $distribution --user $validationUser --cd "/home/$validationUser" -- bash agent-symphony-ci/scripts/wsl-release-validation.sh release "$codexNative"
          if ($LASTEXITCODE -ne 0) { throw 'WSL release validation failed' }

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/agent-symphony/dashboard/package-lock.json
      - name: Build release candidates
        run: |
          version=0.0.0-ci
          case "$GITHUB_REF" in refs/tags/v*) version=${GITHUB_REF_NAME#v};; esac
          SOURCE_DATE_EPOCH=0 scripts/release.sh "$version" dist
      - run: go run ./tools/release -verify dist
      - run: file dist/*.tar.gz && tar -tzf dist/*linux_amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, wsl2, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require signed tag
        run: |
          git fetch --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit=$(git rev-parse --verify "${GITHUB_REF_NAME}^{commit}")
          test "$tag_commit" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
          git show refs/remotes/origin/main:.github/release-signing-allowed-signers > "$RUNNER_TEMP/release-signing-allowed-signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/release-signing-allowed-signers"
          git verify-tag "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes
      - name: Verify freshly downloaded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir downloaded
          gh release download "$GITHUB_REF_NAME" --dir downloaded
          go run ./tools/release -verify downloaded
          version=${GITHUB_REF_NAME#v}
          tar -xzf "downloaded/agent-symphony_${version}_linux_amd64.tar.gz" -C downloaded
          scripts/smoke-release.sh "downloaded/agent-symphony_${version}_linux_amd64/agent-symphony"
