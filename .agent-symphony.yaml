{
  "version": 1,
  "repository": "SysSU/agent-symphony",
  "labels": {
    "ready": "agent-ready",
    "priority_p1": "priority:P1",
    "priority_p2": "priority:P2",
    "priority_p3": "priority:P3"
  },
  "dependencies": {
    "section": "Dependencies"
  },
  "completion_policies": {
    "default": "human-review",
    "human_review_label": "needs-human-review",
    "autonomous_merge_label": "autonomous-merge"
  },
  "concurrency": 1,
  "reconciliation_interval_seconds": 20,
  "worktree_root": ".worktrees",
  "docs_paths": [
    "README.md",
    "docs"
  ],
  "commands": {
    "implementation": [
      "codex",
      "exec",
      "--dangerously-bypass-approvals-and-sandbox",
      "-"
    ],
    "reviewer": [
      "codex",
      "exec",
      "--dangerously-bypass-approvals-and-sandbox",
      "-"
    ],
    "orchestrator": [
      "codex",
      "-c",
      "projects={\"{orchestrator_workspace}\"={trust_level=\"trusted\"}}",
      "--sandbox",
      "danger-full-access",
      "--ask-for-approval",
      "never",
      "--no-alt-screen"
    ],
    "orchestrator_audit": [
      "codex",
      "exec",
      "-c",
      "projects={\"{orchestrator_workspace}\"={trust_level=\"trusted\"}}",
      "-c",
      "model_reasoning_effort=\"medium\"",
      "--sandbox",
      "danger-full-access",
      "--skip-git-repo-check",
      "--ephemeral",
      "--output-last-message",
      "{orchestrator_result}",
      "-"
    ],
    "environment_allowlist": [
      "LANG",
      "LC_ALL",
      "PATH",
      "TERM",
      "TMPDIR"
    ]
  },
  "status": {
    "format": "human",
    "color": "auto"
  }
}
